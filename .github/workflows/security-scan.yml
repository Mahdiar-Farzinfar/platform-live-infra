name: Security Scan

on:
  pull_request: {}
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read

# Keep every main-branch and scheduled result; supersede only older runs for a PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  security:
    name: Repository security scans
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GOTOOLCHAIN: local
      # Scan checked-in composition only; avoid downloading PR-controlled modules.
      CHECKOV_DOWNLOAD_EXTERNAL_MODULES: 'false'
    steps:
      - name: Check out full history for secret scanning
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Read pinned scanner and Task versions
        id: versions
        run: |
          for tool in python task checkov trivy gitleaks actionlint; do
            version="$(awk -v name="$tool" '$1 == name { print $2 }' tooling/.tool-versions)"
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
            printf '%s=%s\n' "$tool" "$version" >> "$GITHUB_OUTPUT"
          done

      - name: Set up pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ steps.versions.outputs.python }}

      - name: Set up pinned Go from go.mod
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up pinned Task
        uses: arduino/setup-task@bfe25a35f5c1f609e1d6153197b3b42a04ae054c  # v3.0.0
        with:
          version: ${{ steps.versions.outputs.task }}

      - name: Set up pinned Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567  # v0.3.1
        with:
          version: v${{ steps.versions.outputs.trivy }}
          cache: false

      - name: Set up pinned Terragrunt
        uses: autero1/action-terragrunt@aefb0a43c4f5503a91fefb307745c4d51c26ed0e  # v3.0.2
        with:
          terragrunt-version-file: tooling/.terragrunt-version

      - name: Install pinned Checkov
        env:
          CHECKOV_VERSION: ${{ steps.versions.outputs.checkov }}
        run: python -m pip install --disable-pip-version-check --no-cache-dir --no-input "checkov==$CHECKOV_VERSION"

      - name: Install pinned Gitleaks and Actionlint
        env:
          GITLEAKS_VERSION: ${{ steps.versions.outputs.gitleaks }}
          ACTIONLINT_VERSION: ${{ steps.versions.outputs.actionlint }}
          GOBIN: ${{ runner.temp }}/security-bin
        run: |
          mkdir -p "$GOBIN"
          go install "github.com/zricethezav/gitleaks/v8@v$GITLEAKS_VERSION"
          go install "github.com/rhysd/actionlint/cmd/actionlint@v$ACTIONLINT_VERSION"
          printf '%s\n' "$GOBIN" >> "$GITHUB_PATH"

      - name: Validate service control policy JSON
        run: task validate:scp:json

      - name: Verify configured security baseline with local renders
        run: task verify:security-baseline

      # Taskfile.yml owns scanner scope, severity, exclusions, and failure policy.
      # Results stay in job logs; no raw repository or secret reports are uploaded.
      - name: Run Checkov, Trivy, Gitleaks, and Actionlint
        env:
          TRIVY_CACHE_DIR: ${{ runner.temp }}/trivy-cache
          CHECKOV_MODULE_PATH: ${{ runner.temp }}/checkov-external-modules
        run: task security-all

name: Drift Detection

on:
  schedule:
    - cron: '31 5 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read

# Serialize scheduled and manual scans; an active scan is never canceled.
concurrency:
  group: ${{ github.workflow }}-${{ github.repository }}
  cancel-in-progress: false

jobs:
  drift:
    name: Read-only infrastructure drift
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Require the trusted main branch
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != 'refs/heads/main' ]]; then
            echo 'Drift scans require the main branch.' >&2
            exit 1
          fi

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Read pinned tool versions
        id: versions
        run: |
          set -euo pipefail
          for tool in python task; do
            version="$(awk -v name="$tool" '$1 == name { print $2 }' tooling/.tool-versions)"
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
            printf '%s=%s\n' "$tool" "$version" >> "$GITHUB_OUTPUT"
          done
          terraform_version="$(cat tooling/.terraform-version)"
          [[ "$terraform_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          printf 'terraform=%s\n' "$terraform_version" >> "$GITHUB_OUTPUT"

      - name: Set up pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ steps.versions.outputs.python }}

      - name: Set up pinned Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_version: ${{ steps.versions.outputs.terraform }}
          terraform_wrapper: false

      - name: Set up pinned Terragrunt
        uses: autero1/action-terragrunt@aefb0a43c4f5503a91fefb307745c4d51c26ed0e  # v3.0.2
        with:
          terragrunt-version-file: tooling/.terragrunt-version

      - name: Set up pinned Task
        uses: arduino/setup-task@bfe25a35f5c1f609e1d6153197b3b42a04ae054c  # v3.0.0
        with:
          version: ${{ steps.versions.outputs.task }}

      - name: Install inventory parser from the hashed repository lockfile
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input --require-hashes -r docs/requirements.txt

      # This non-secret repository variable must name an approved OIDC planning
      # role. Multi-account credential routing must be reviewed before activation.
      - name: Require a reviewed drift identity
        id: drift_identity
        env:
          AWS_DRIFT_ROLE_ARN: ${{ vars.AWS_DRIFT_ROLE_ARN }}
        run: |
          set -euo pipefail
          # Placeholder mode: variable not yet configured, skip scan gracefully.
          if [[ -z "${AWS_DRIFT_ROLE_ARN:-}" ]]; then
            echo 'AWS_DRIFT_ROLE_ARN not configured; drift scan disabled.' >&2
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ ! "$AWS_DRIFT_ROLE_ARN" =~ ^arn:aws:iam::[0-9]{12}:role/[A-Za-z0-9+=,.@_/-]+$ ]]; then
            echo 'Configure a reviewed AWS_DRIFT_ROLE_ARN repository variable.' >&2
            exit 1
          fi
          echo 'enabled=true' >> "$GITHUB_OUTPUT"

      - name: Assume read-only planning role with GitHub OIDC
        if: steps.drift_identity.outputs.enabled == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DRIFT_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: drift-${{ github.run_id }}
          mask-aws-account-id: true

      # Taskfile.yml owns inventory selection, ordering, plan flags, and status.
      # Plans are captured in memory and never printed or uploaded.
      - name: Scan remote-state stacks
        if: steps.drift_identity.outputs.enabled == 'true'
        run: task drift

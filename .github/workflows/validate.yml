name: Validate

on:
  pull_request: {}
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

# Keep all main-branch results; supersede only older runs for the same PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static-validation:
    name: Static repository validation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Read pinned tool versions
        id: versions
        run: |
          for tool in python nodejs task yamllint markdownlint-cli2; do
            version="$(awk -v name="$tool" '$1 == name { print $2 }' tooling/.tool-versions)"
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
            printf '%s=%s\n' "${tool//-/_}" "$version" >> "$GITHUB_OUTPUT"
          done
          terraform_version="$(cat tooling/.terraform-version)"
          [[ "$terraform_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          printf 'terraform=%s\n' "$terraform_version" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ steps.versions.outputs.python }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: ${{ steps.versions.outputs.nodejs }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_version: ${{ steps.versions.outputs.terraform }}
          terraform_wrapper: false

      - name: Set up Terragrunt
        uses: autero1/action-terragrunt@aefb0a43c4f5503a91fefb307745c4d51c26ed0e  # v3.0.2
        with:
          terragrunt-version-file: tooling/.terragrunt-version

      - name: Set up Task
        uses: arduino/setup-task@bfe25a35f5c1f609e1d6153197b3b42a04ae054c  # v3.0.0
        with:
          version: ${{ steps.versions.outputs.task }}

      - name: Install pinned document linters
        env:
          YAMLLINT_VERSION: ${{ steps.versions.outputs.yamllint }}
          MARKDOWNLINT_VERSION: ${{ steps.versions.outputs.markdownlint_cli2 }}
        run: |
          python -m pip install --disable-pip-version-check "yamllint==$YAMLLINT_VERSION"
          npm install --global --ignore-scripts --no-audit --no-fund "markdownlint-cli2@$MARKDOWNLINT_VERSION"

      - name: Check Terraform and Terragrunt formatting
        env:
          CHECK: 'true'
        run: task fmt

      - name: Validate SCP JSON
        run: task validate:scp:json

      - name: Lint
        run: task lint

      - name: Check configured security baseline locally
        run: task verify:security-baseline
